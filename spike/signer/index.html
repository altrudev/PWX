<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PWX Signer (spike)</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0; padding: 20px; max-width: 420px; }
  #card { border: 1px solid #ccc; border-radius: 12px; padding: 16px; }
  #card[hidden] { display: none; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .new { background: #fff1d6; border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-weight: 600; }
  ul { margin: 4px 0 12px; padding-left: 20px; }
  button { font-size: 17px; padding: 10px 18px; border-radius: 10px; border: 0; margin-right: 8px; }
  #approve { background: #1a7f37; color: #fff; } #deny { background: #eee; }
</style></head>
<body>
<p id="status">PWX Signer</p>
<section id="card" hidden>
  <h1 id="title"></h1>
  <div id="added" class="new" hidden></div>
  <div>This app can:</div>
  <ul id="all"></ul>
  <label for="pass">Passphrase</label><br><input id="pass" type="password" autocomplete="current-password" style="font-size:17px;padding:8px;margin:4px 0 12px;width:90%"><br>
  <p id="err" style="color:#b00" hidden></p>
  <button id="approve" type="button">Approve</button><button id="deny" type="button">Deny</button>
</section>
<script type="module" src="app.mjs"></script>
</body></html>
